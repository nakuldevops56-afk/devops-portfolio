name: Linux Health Check CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Shell Syntax
        run: |
          bash -n health_check.sh
          bash -n test_health_check.sh

      - name: Run Automated Tests
        run: |
          chmod +x health_check.sh test_health_check.sh
          ./test_health_check.sh

      - name: Run Health Check
        run: ./health_check.sh 100 100

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            nakul2047/linux-health-check:latest
            nakul2047/linux-health-check:${{ github.sha }}

